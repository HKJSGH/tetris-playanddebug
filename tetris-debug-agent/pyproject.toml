[project]
name = "tetris-debug-agent"
version = "0.1.0"
description = "Tetris: debug while playing — a multimodal agent that fixes injected bugs from gameplay telemetry, errors, and feedback."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pytest>=7.4",
    "langgraph>=0.2",
    "openai>=1.40",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["game*", "agent*", "eval*", "scripts*"]
