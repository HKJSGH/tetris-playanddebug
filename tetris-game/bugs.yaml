B12:
  name: 重新开始后窗口位置重置
  symptom: "游戏窗口默认出现在屏幕左上角；玩家把窗口拖到舒适位置后，一局结束再开新局时窗口又回到左上角，位置没有保持。"
  injection: >
    作用域写错形态。clean 版为实现跨局窗口位置保持，新增 initial_pos
    参数、_setup_ui 应用初始位置、_do_finalize 收尾前捕获 _final_pos、
    launch() 循环外用 pos 变量跨局传递。buggy 版所有环节都在且写法
    正确，唯独 pos = None 被写进了 while 循环体内——每轮循环开头都把
    上一局保存的位置重置为 None，跨局传递失效。
  signal: "埋点无法感知（窗口管理问题）；依赖玩家文字反馈（重新开始后窗口回到左上角）"
  status: injected
  clean_code: |
    # tetris_v0.py  launch()
    n = round_id
    pos: str | None = None  # 窗口位置跨局保持，None 用系统默认
    while True:
        game = TetrisGame(round_id=n, seed=seed, runs_root=runs_root, initial_pos=pos)
        game.run()
        pos = game._final_pos
        if not game._play_again:
            break
        n += 1
  buggy_code: |
    # tetris_buggy.py  launch()：pos 被写在循环体内，每轮循环开头被重置
    n = round_id
    while True:
        pos: str | None = None
        game = TetrisGame(round_id=n, seed=seed, runs_root=runs_root, initial_pos=pos)
        game.run()
